server:
  port: 8080

jwt:
  secret: legal-assistant-jwt-secret-key-2024-this-is-a-long-enough-key
  expiration: 604800000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/legal_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      lettuce:
        pool:
          max-active: 30
          max-idle: 10
          min-idle: 5

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# LangChain4j OpenAI Configuration
langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:your-api-key}
      model-name: gpt-4o-mini
      temperature: 0.7
      timeout: 120s
      max-tokens: 2000
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${OPENAI_API_KEY:your-api-key}
      model-name: gpt-4o-mini
      temperature: 0.7
      timeout: 120s
    embedding-model:
      api-key: ${OPENAI_API_KEY:your-api-key}
      model-name: text-embedding-3-small
      timeout: 60s
      log-requests: true
      log-responses: true

# File storage
file:
  upload-dir: ./uploads

# 启动时自动导入预置法律文档（classpath:legal-documents/）
# RAG 统一使用 LightRAG（hybrid query/data）
legal:
  seed-documents:
    enabled: true
  lightrag:
    base-url: ${LIGHTRAG_BASE_URL:http://localhost:9621}
    api-key: ${LIGHTRAG_API_KEY:}
    query-mode: hybrid
    ingest-poll-interval-ms: 2000
    ingest-poll-timeout-seconds: 600
    file-source-prefix: legal-doc
