# SearXNG minimal settings for LegalAssistant (JSON API, no UI auth required for internal use)
use_default_settings: true

general:
  instance_name: "legal-searxng"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  secret_key: "legal-assistant-searxng-change-me"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0

engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: wikipedia
    disabled: false
