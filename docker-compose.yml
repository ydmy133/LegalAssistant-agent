version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: legal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123123
      MYSQL_DATABASE: legal_assistant
    ports:
      - "3306:3306"
    volumes:
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: legal-redis
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    container_name: legal-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    container_name: legal-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling bge-m3..."
        ollama pull bge-m3
        echo "bge-m3 ready"
    restart: "no"

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: legal-lightrag
    ports:
      - "9621:9621"
    env_file:
      - deploy/lightrag/.env
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      EMBEDDING_BINDING_HOST: http://ollama:11434
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIM: 1024
      LLM_BINDING: openai
      LLM_BINDING_HOST: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-chat
      # DeepSeek key for indexing/query keyword extraction (openai binding).
      # Do NOT nest ${A:-${B}} — compose appends a stray '}' into the value.
      LLM_BINDING_API_KEY: ${DEEPSEEK_API_KEY}
      # openai.py falls back to OPENAI_API_KEY when api_key is empty
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-change-me-lightrag-api-key}
    volumes:
      - lightrag-data:/app/data
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legal-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/legal_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-change-me-lightrag-api-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-api-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      FILE_UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - lightrag
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-80}"
    depends_on:
      - backend

volumes:
  mysql-data:
  ollama-data:
  lightrag-data:
  backend-uploads:
