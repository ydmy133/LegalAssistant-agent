version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: legal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123123
      MYSQL_DATABASE: legal_assistant
    ports:
      - "3306:3306"
    volumes:
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: legal-redis
    ports:
      - "6379:6379"

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: legal-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    command: milvus run standalone

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: legal-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd-data:/etcd
    # advertise 使用容器内可解析地址，避免 Milvus 无法连接
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: legal-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data

  ollama:
    image: ollama/ollama:latest
    container_name: legal-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    container_name: legal-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling bge-m3..."
        ollama pull bge-m3
        echo "bge-m3 ready"
    restart: "no"

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: legal-lightrag
    ports:
      - "9621:9621"
    env_file:
      - deploy/lightrag/.env
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      EMBEDDING_BINDING_HOST: http://ollama:11434
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIM: 1024
      LLM_BINDING: openai
      LLM_BINDING_HOST: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-chat
      LLM_BINDING_API_KEY: ${DEEPSEEK_API_KEY:-}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-change-me-lightrag-api-key}
    volumes:
      - lightrag-data:/app/data
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legal-backend
    environment:
      # 让 Spring Boot 指向容器内的 MySQL/Redis/Milvus 服务名
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/legal_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: legal_docs_local
      MILVUS_DIMENSION: "384"
      LEGAL_EMBEDDING_PROVIDER: local
      LEGAL_RAG_PROVIDER: ${LEGAL_RAG_PROVIDER:-milvus}
      LIGHTRAG_BASE_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-change-me-lightrag-api-key}

      # 模型 API Key：可先用占位值启动；实际使用前请替换成你的 Key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-api-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      FILE_UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - milvus
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal-frontend
    ports:
      # 生产默认 3000→nginx:80；开发 compose 通过环境变量改为 3000→vite:3000
      - "${FRONTEND_HOST_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-80}"
    depends_on:
      - backend

volumes:
  mysql-data:
  milvus-data:
  etcd-data:
  minio-data:
  ollama-data:
  lightrag-data:
  backend-uploads:
